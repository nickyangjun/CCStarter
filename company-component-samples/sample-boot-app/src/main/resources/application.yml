spring:
  application:
    name: sample-boot-app
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: 18080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.company.component.log.request: DEBUG

component:
  exception:
    enabled: true
    include-path: true
    expose-stack-trace: false
    default-error-code: INTERNAL_ERROR
  auth:
    enabled: true
    jwt-secret: ${JWT_SECRET:01234567890123456789012345678901234567890123456789012}
    expire-minutes: 120
    whitelist:
      - /actuator/**
      - /api/sample/ping
      - /api/sample/error/**
      - /api/sample/auth/me
      # 登录接口（login 模块也会自动合并 paths；显式写出便于排查 401）
      - /api/auth/sms/**
      - /api/auth/email/**
    login:
      enabled: true
      sms-length: 6
      email-code-length: 6
      sms:
        enabled: true
      email:
        enabled: true
      register:
        enabled: true
        login-as-register: true
      # 测试验证码（fixed-code 等）仅写在 application-test.yml，启动时 --spring.profiles.active=test
  dict:
    enabled: true
    cache:
      type: memory
      key-prefix: "${spring.application.name:sample-boot-app}:dict"
  log:
    enabled: true
    trace:
      allow-local-generate: true
      response-header: true
    request:
      enabled: true
      log-level: DEBUG
      exclude-paths:
        - /actuator/**
