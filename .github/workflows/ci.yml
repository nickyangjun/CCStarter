name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with tests
        run: mvn -B clean verify

      - name: E2E smoke test (sample-boot-app)
        run: |
          chmod +x scripts/*.sh scripts/lib/common.sh
          BUILD_FIRST=0 ./scripts/smoke-test.sh
