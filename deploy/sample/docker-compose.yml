services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sample
      MYSQL_USER: sample
      MYSQL_PASSWORD: sample
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  sample-boot-app:
    image: ccstarter/sample-boot-app:local
    build:
      context: ../..
      dockerfile: deploy/sample/Dockerfile
      args:
        SKIP_TESTS: ${DOCKER_SKIP_TESTS:-1}
    ports:
      - "${SAMPLE_HOST_PORT:-18080}:18080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker,test
      JAVA_OPTS: "-Dlogging.level.com.company.component.log.request=DEBUG"
      JWT_SECRET: "01234567890123456789012345678901234567890123456789012"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/sample?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: sample
      SPRING_DATASOURCE_PASSWORD: sample
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
